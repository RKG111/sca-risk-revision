version: "3.9"

services:
  # ── Joern CPG Engine ─────────────────────────────────────────────────────────
  # Starts Joern in REST server mode so the Python API can submit CPGQL queries
  # Docs: https://github.com/joernio/joern
  joern:
    image: ghcr.io/joernio/joern:nightly
    container_name: sca-joern
    command: joern --server --serverHost 0.0.0.0 --serverPort 8080
    ports:
      - "8080:8080"
    volumes:
      # Mount codebases into the container so Joern can parse them
      - ${CODEBASE_ROOT:-../codebases}:/codebases:ro
      # Persist generated CPGs between restarts
      - joern-cpgs:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/version"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── FastAPI Application ───────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sca-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - JOERN_HOST=joern
      - JOERN_PORT=8080
    volumes:
      - ${CODEBASE_ROOT:-../codebases}:/codebases:ro
      - ./../.chromadb:/app/.chromadb
    depends_on:
      joern:
        condition: service_healthy
    restart: unless-stopped

volumes:
  joern-cpgs:
